<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orta Koridor Şampiyonları</title>
    <style>
        body { background-color: #091428; color: #f0e6d2; font-family: 'Cinzel', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c8aa6e; padding-bottom: 10px; margin-bottom: 30px; }
        
        .site-logo { display: flex; align-items: center; text-decoration: none; }
        .site-logo img { height: 45px; width: auto; transition: transform 0.2s ease; }
        .site-logo img:hover { transform: scale(1.1); }

        h1 { color: #c8aa6e; margin: 0; font-size: 24px; letter-spacing: 2px; }
        .champion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .champion-card { background: #1e2328; border: 1px solid #c8aa6e; border-radius: 6px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.2s; padding-bottom: 10px; }
        .champion-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(200, 170, 110, 0.4); }
        .img-container { width: 100%; height: 220px; background: #010a13; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .champion-card h3 { margin: 12px 0 5px 0; color: #f0e6d2; }
        .champion-card p { margin: 0 0 10px 0; color: #a09b8c; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #010a13; border: 2px solid #c8aa6e; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #c8aa6e; }
        .tag { display: inline-block; padding: 5px 10px; margin: 4px; border-radius: 4px; font-size: 13px; }
        .tag.item { background: #1c3d5a; border: 1px solid #005a82; color: #fff; }
        .tag.counter { background: #5a1c1c; border: 1px solid #820000; color: #fff; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="lol.html" class="site-logo">
            <img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/logo.png" alt="LoL Logo">
        </a>
        <h1>ORTA KORIDOR (MID)</h1>
        <div></div>
    </div>

    <main class="champion-grid">
        <div class="champion-card" onclick="openModal('ahri')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/ahri.jpg" alt="Ahri"></div>
            <h3>Ahri</h3>
            <p>Dokuz Kuyruklu Tilki</p>
        </div>
        <div class="champion-card" onclick="openModal('zed')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/zed.jpg" alt="Zed"></div>
            <h3>Zed</h3>
            <p>Gölgelerin Efendisi</p>
        </div>
        <div class="champion-card" onclick="openModal('diana')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/diana.jpg" alt="Diana"></div>
            <h3>Diana</h3>
            <p>Ay'ın Gazabı</p>
        </div>
    </main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const championsData = {
            ahri: {
                name: "Ahri", title: "Dokuz Kuyruklu Tilki",
                abilities: [
                    { key: "Pasif", name: "Ruh Hırsızı", desc: "Yetenekler tuttukça can yeniler." },
                    { key: "Q", name: "Küre Saldırısı", desc: "Büyü ve gerçek hasar verir." },
                    { key: "W", name: "Tilki Ateşi", desc: "Yakınındaki rakiplere ateş küreleri yollar." },
                    { key: "E", name: "Ayartma", desc: "Rakibi kendine çekip sersemletir." },
                    { key: "R", name: "Ruh Saldırısı", desc: "3 kez ileri atılma hakkı verir." }
                ],
                items: ["Luden'in Çığırtkanı", "Gölgealev", "Rabadon'un Şapkası", "Sihirbaz Pabuçları"],
                counters: ["Yasuo", "Zed", "Fizz"]
            },
            zed: {
                name: "Zed", title: "Gölgelerin Efendisi",
                abilities: [
                    { key: "Pasif", name: "Düşene Darbe", desc: "Canı az hedeflere ilave büyü hasarı verir." },
                    { key: "Q", name: "Keskin Shuriken", desc: "Gölgeleriyle birlikte shuriken fırlatır." },
                    { key: "W", name: "Canlı Gölge", desc: "İleriye bir gölge gönderir ve yer değiştirebilir." },
                    { key: "E", name: "Gölge Kesişi", desc: "Etrafa alan hasarı verir." },
                    { key: "R", name: "Ölüm İşareti", desc: "Hedefe kilitlenip yüksek patlama hasarı uygular." }
                ],
                items: ["Sinsi Pençe", "Kararma", "Serylda'nın Oyması", "Ionia Çizmeleri"],
                counters: ["Malphite", "Lissandra", "Anivia"]
            },
            diana: {
                name: "Diana", title: "Ay'ın Gazabı",
                abilities: [
                    { key: "Pasif", name: "Gümüşkoç Bıçağı", desc: "Her 3. vuruşta etrafa büyü hasarı verir." },
                    { key: "Q", name: "Hilal Saldırısı", desc: "Kavisli bir ay ışığı fırlatarak hedefleri işaretler." },
                    { key: "W", name: "Solgun Kaskat", desc: "Kalkan oluşturan döner küreler çağırır." },
                    { key: "E", name: "Ay Atılımı", desc: "İşaretli bir hedefe atılarak bekleme süresini sıfırlar." },
                    { key: "R", name: "Ay Doğumu", desc: "Çevresindeki rakipleri kendine çekip yere çarpar." }
                ],
               items: ["Lich Boğan", "Rabadon'un Şapkası", "Nashor'un Dişi", "Sihirbaz Pabuçları"],
                counters: ["Galio", "Irelia", "Swain"]
            }
        };

        function openModal(champKey) {
            const champ = championsData[champKey];
            const modal = document.getElementById("detailModal");
            const modalBody = document.getElementById("modalBody");
            let abilitiesHTML = champ.abilities.map(a => `<li><b>[${a.key}] ${a.name}:</b> ${a.desc}</li>`).join("");
            let itemsHTML = champ.items.map(i => `<span class="tag item">${i}</span>`).join(" ");
            let countersHTML = champ.counters.map(c => `<span class="tag counter">${c}</span>`).join(" ");
            modalBody.innerHTML = `
                <h2 style="color: #c8aa6e; margin-top:0;">${champ.name} <span style="font-size:16px; color:#a09b8c;">- ${champ.title}</span></h2>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Yetenekler</h3>
                <ul style="padding-left: 20px; line-height: 1.6;">${abilitiesHTML}</ul>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Tavsiye Edilen Eşyalar</h3>
                <div style="margin-bottom: 15px;">${itemsHTML}</div>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Zorlandığı Rakipler (Counters)</h3>
                <div>${countersHTML}</div>`;
            modal.style.display = "flex";
        }
        function closeModal() { document.getElementById("detailModal").style.display = "none"; }
    </script>
</body>
</html>
