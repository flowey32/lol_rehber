<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt Koridor Şampiyonları</title>
    <style>
        body { background-color: #091428; color: #f0e6d2; font-family: 'Cinzel', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #c8aa6e; padding-bottom: 10px; margin-bottom: 20px; }
        
        .site-logo { display: flex; align-items: center; text-decoration: none; }
        .site-logo img { height: 45px; width: auto; transition: transform 0.2s ease; }
        .site-logo img:hover { transform: scale(1.1); }

        h1 { color: #c8aa6e; margin: 0; font-size: 24px; letter-spacing: 2px; }
        .category-title { color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px; margin: 30px 0 15px 0; font-size: 20px; }
        .champion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .champion-card { background: #1e2328; border: 1px solid #c8aa6e; border-radius: 6px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.2s; padding-bottom: 10px; }
        .champion-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(200, 170, 110, 0.4); }
        .img-container { width: 100%; height: 220px; background: #010a13; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .champion-card h3 { margin: 12px 0 5px 0; color: #f0e6d2; }
        .champion-card p { margin: 0 0 10px 0; color: #a09b8c; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #010a13; border: 2px solid #c8aa6e; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #c8aa6e; }
        .tag { display: inline-block; padding: 5px 10px; margin: 4px; border-radius: 4px; font-size: 13px; }
        .tag.item { background: #1c3d5a; border: 1px solid #005a82; color: #fff; }
        .tag.counter { background: #5a1c1c; border: 1px solid #820000; color: #fff; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="lol.html" class="site-logo">
            <img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/logo.png" alt="LoL Logo">
        </a>
        <h1>ALT KORIDOR (BOT)</h1>
        <div></div>
    </div>

    <h2 class="category-title">Nisancilar (ADC)</h2>
    <main class="champion-grid">
        <div class="champion-card" onclick="openModal('jinx')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/jinx.jpg" alt="Jinx"></div>
            <h3>Jinx</h3>
            <p>Kural Tanımaz Delifişek</p>
        </div>
        <div class="champion-card" onclick="openModal('caitlyn')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/caitlyn.jpg" alt="Caitlyn"></div>
            <h3>Caitlyn</h3>
            <p>Piltover Şerif Yardımcısı</p>
        </div>
    </main>

    <h2 class="category-title">Destekler (Support)</h2>
    <main class="champion-grid">
        <div class="champion-card" onclick="openModal('thresh')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/thresh.jpg" alt="Thresh"></div>
            <h3>Thresh</h3>
            <p>Zincirli Gardiyan</p>
        </div>
        <div class="champion-card" onclick="openModal('lulu')">
            <div class="img-container"><img src="file:///C|/Users/Ogr14/Desktop/jj/Lol/Resimler/lulu.jpg" alt="Lulu"></div>
            <h3>Lulu</h3>
            <p>Işıltılı Muhafız</p>
        </div>
    </main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const championsData = {
            jinx: {
                name: "Jinx", title: "Kural Tanımaz Delifişek",
                abilities: [
                    { key: "Pasif", name: "Heyecan!", desc: "Katliam yapınca aşırı hızlanır." },
                    { key: "Q", name: "Değiştir!", desc: "Tüfek (Roket/Minigun) değiştirir." },
                    { key: "W", name: "Zaps!", desc: "Uzun menzilli elektrik atışı yapar." },
                    { key: "E", name: "Bombalar!", desc: "Yere kapanlar kurar." },
                    { key: "R", name: "Super Mega Ölüm Roketi!", desc: "Harita genelinde patlayan roket atar." }
                ],
                items: ["Kraken Katili", "Ebedi Kılıç", "Runaan'ın Kasırgası", "Sürat Çizmeleri"],
                counters: ["Draven", "Caitlyn", "Samira"]
            },
            caitlyn: {
                name: "Caitlyn", title: "Piltover Şerif Yardımcısı",
                abilities: [
                    { key: "Pasif", name: "Kafadan Vuruş", desc: "Belli saldırıda bir güçlendirilmiş vuruş yapar." },
                    { key: "Q", name: "Peşinde", desc: "Delici bir tüfek atışı yapar." },
                    { key: "W", name: "Yordle Kapanı", desc: "Rakibi sabitleyen kapanlar kurar." },
                    { key: "E", name: "Ağ Atışı", desc: "Geriye doğru ağ atıp yavaşlatır." },
                    { key: "R", name: "Kurşun Yağmuru", desc: "Tek hedefe kilitlenip devasa menzilden mermi atar." }
                ],
                items: ["Fırtınatepki", "Ebedi Kılıç", "Toplama", "Sihirbaz Pabuçları"],
                counters: ["Ezreal", "Twitch", "Tristana"]
            },
            thresh: {
                name: "Thresh", title: "Zincirli Gardiyan",
                abilities: [
                    { key: "Pasif", name: "Korku Sal", desc: "Ölen rakiplerden ruh toplayarak zırh kazanır." },
                    { key: "Q", name: "Ölüm Cezası", desc: "Kancayı atıp rakibi kendine çeker." },
                    { key: "W", name: "Karanlık Geçit", desc: "Müttefiklerin alması için fener atar." },
                    { key: "E", name: "Flay", desc: "Kamçılayarak rakibin yönünü değiştirir." },
                    { key: "R", name: "Kutu", desc: "Yavaşlatan ve hasar veren duvarlar oluşturur." }
                ],
                items: ["Locket", "Kansız", "Gözcünün Pelerini", "Ionia Çizmeleri"],
                counters: ["Morgana", "Zyra", "Brand"]
            },
            lulu: {
                name: "Lulu", title: "Işıltılı Muhafız",
                abilities: [
                    { key: "Pasif", name: "Pix, Peri Yoldaş", desc: "Saldırılara ek sihirli atışlar ekler." },
                    { key: "Q", name: "Işıltılı Mermi", desc: "Pix ve Lulu ile birlikte yavaşlatan oklar atar." },
                    { key: "W", name: "Yetenek/Polimorf", desc: "Dostun hızını artırır veya rakibi sincaba çevirir." },
                    { key: "E", name: "Yardım, Pix!", desc: "Dosta kalkan verir veya rakibe görüş açar." },
                    { key: "R", name: "Büyüteç", desc: "Dostu devleştirip etrafını havaya savurur." }
                ],
                items: ["Shurelya'nın Savaşı", "Ardent Censer", "Staff of Flowing Water", "Ionia Çizmeleri"],
                counters: ["Nautilus", "Blitzcrank", "Pyke"]
            }
        };

        function openModal(champKey) {
            const champ = championsData[champKey];
            const modal = document.getElementById("detailModal");
            const modalBody = document.getElementById("modalBody");
            let abilitiesHTML = champ.abilities.map(a => `<li><b>[${a.key}] ${a.name}:</b> ${a.desc}</li>`).join("");
            let itemsHTML = champ.items.map(i => `<span class="tag item">${i}</span>`).join(" ");
            let countersHTML = champ.counters.map(c => `<span class="tag counter">${c}</span>`).join(" ");
            modalBody.innerHTML = `
                <h2 style="color: #c8aa6e; margin-top:0;">${champ.name} <span style="font-size:16px; color:#a09b8c;">- ${champ.title}</span></h2>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Yetenekler</h3>
                <ul style="padding-left: 20px; line-height: 1.6;">${abilitiesHTML}</ul>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Tavsiye Edilen Eşyalar</h3>
                <div style="margin-bottom: 15px;">${itemsHTML}</div>
                <h3 style="color: #c8aa6e; border-bottom: 1px solid #c8aa6e; padding-bottom: 5px;">Zorlandığı Rakipler (Counters)</h3>
                <div>${countersHTML}</div>`;
            modal.style.display = "flex";
        }
        function closeModal() { document.getElementById("detailModal").style.display = "none"; }
    </script>
</body>
</html>
